backend:
  name: github
  repo: AltibaseUnion/AltibaseUnion
  branch: main
  base_url: https://altibase-union-cms-oauth.altibaseunion.workers.dev
  auth_endpoint: auth
  squash_merges: true
  use_graphql: true

publish_mode: editorial_workflow
locale: ko
site_url: https://altibaseunion.github.io/AltibaseUnion/
display_url: https://altibaseunion.github.io/AltibaseUnion/
logo_url: /AltibaseUnion/images/logo.png
media_folder: public/images/uploads
public_folder: /AltibaseUnion/images/uploads
collections:
  - name: notices
    label: 공지사항
    label_singular: 공지
    folder: content/notices
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    preview_path: "notices/{{fields.slug}}/"
    preview_path_date_field: date
    media_folder: /public/images/uploads/notices
    public_folder: /AltibaseUnion/images/uploads/notices
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title, important, draft]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 요약, name: description, widget: text }
      - { label: 게시일, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: 수정일, name: updatedDate, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - label: URL 영문 이름
        name: slug
        widget: string
        hint: 영문 소문자·숫자·하이픈만 입력합니다. 예) wage-agreement
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '영문 소문자, 숫자, 하이픈만 사용할 수 있습니다.']
      - { label: 분류, name: category, widget: hidden, default: 공지 }
      - { label: 태그, name: tags, widget: list, required: false, default: [] }
      - { label: 중요 공지, name: important, widget: boolean, default: false }
      - { label: 대표 이미지, name: thumbnail, widget: image, required: false }
      - { label: 대표 이미지 대체텍스트, name: thumbnailAlt, widget: string, required: false, hint: 비워두면 제목을 사용합니다. }
      - label: 첨부파일
        name: attachments
        widget: list
        required: false
        default: []
        fields:
          - { label: 표시 이름, name: name, widget: string }
          - { label: 파일, name: url, widget: file, media_folder: /public/files/notices, public_folder: /AltibaseUnion/files/notices }
      - { label: 초안, name: draft, widget: boolean, default: true, hint: 게시 전까지 켜 두십시오. }
      - { label: 본문, name: body, widget: markdown }

  - name: activities
    label: 월별 활동보고
    label_singular: 활동보고
    folder: content/activities
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    preview_path: "activities/{{fields.slug}}/"
    media_folder: /public/images/uploads/activity-reports
    public_folder: /AltibaseUnion/images/uploads/activity-reports
    summary: "{{period}} · {{title}}"
    sortable_fields: [date, title, year, month, draft]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 요약, name: description, widget: text }
      - { label: 게시일, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: 수정일, name: updatedDate, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: 활동 기간, name: period, widget: string, hint: 예) 2026년 8월 }
      - { label: 연도, name: year, widget: number, value_type: int, min: 2000, max: 2100 }
      - { label: 월, name: month, widget: number, value_type: int, min: 1, max: 12 }
      - label: URL 및 파일명
        name: slug
        widget: string
        hint: 반드시 YYYY-MM 형식으로 입력합니다. Decap 날짜 template tag 대신 이 값을 사용합니다.
        pattern: ['^(?:19|20|21)[0-9]{2}-(?:0[1-9]|1[0-2])$', 'YYYY-MM 형식으로 입력하십시오.']
      - { label: 분류, name: category, widget: hidden, default: 활동보고 }
      - { label: 태그, name: tags, widget: list, required: false, default: [] }
      - { label: 대표 이미지, name: thumbnail, widget: image, required: false }
      - { label: 대표 이미지 대체텍스트, name: thumbnailAlt, widget: string, required: false, hint: 비워두면 제목을 사용합니다. }
      - { label: 초안, name: draft, widget: boolean, default: true, hint: 게시 전까지 켜 두십시오. }
      - { label: 본문, name: body, widget: markdown }
